name: Generate Terminal GIF

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Pillow
        run: pip install Pillow
      
      - name: Generate terminal GIF
        run: |
          mkdir -p assets
          python3 << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          W, H = 900, 520
          BG = (13, 17, 23)
          GREEN = (0, 255, 65)
          PINK = (255, 0, 255)
          CYAN = (0, 255, 255)
          GRAY = (136, 136, 136)
          RED = (255, 95, 86)
          YELLOW = (255, 189, 46)
          GREEN_BTN = (39, 201, 63)
          HEADER_BG = (22, 27, 34)
          BORDER = (48, 54, 61)

          # Загружаем шрифт
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 13)
          except:
              try:
                  font = ImageFont.truetype("/usr/share/fonts/TTF/DejaVuSansMono.ttf", 13)
              except:
                  try:
                      font = ImageFont.truetype("/usr/share/fonts/truetype/liberation/LiberationMono-Regular.ttf", 13)
                  except:
                      font = ImageFont.load_default()

          frames = []

          # Сцены: (текст, цвет, задержка_в_секундах)
          scenes = [
              ("root@darkpix:~# neofetch", GREEN, 0.8),
              ("", None, 0.2),
              ("███████████████████████████████████████████████████████████████████", PINK, 0.1),
              ("█  ████      ███     ████     █   █    ████     █████    █   █    █", PINK, 0.1),
              ("█  █   █    █   █    █   █    █  █     █   █      █       █ █     █", PINK, 0.1),
              ("█  █   █    █████    ████     ███      ████       █        █      █", PINK, 0.1),
              ("█  █   █    █   █    █  █     █  █     █          █       █ █     █", PINK, 0.1),
              ("█  ████     █   █    █   █    █   █    █        █████    █   █    █", PINK, 0.1),
              ("███████████████████████████████████████████████████████████████████", PINK, 0.3),
              ("", None, 0.2),
              ("OS: Arch Linux x86_64", CYAN, 0.1),
              ("Host: Custom Workstation", CYAN, 0.1),
              ("Kernel: 6.8.0-arch1-1", CYAN, 0.1),
              ("Uptime: 420 days, 6 hours, 9 mins", CYAN, 0.1),
              ("Shell: zsh 5.9", CYAN, 0.1),
              ("DE: i3wm | WM: i3", CYAN, 0.1),
              ("", None, 0.1),
              ("CPU: AMD Ryzen 9 7950X (32) @ 5.7GHz", PINK, 0.1),
              ("GPU: NVIDIA GeForce GTX 4090", PINK, 0.1),
              ("Memory: 64234MiB / 65536MiB", PINK, 0.1),
              ("", None, 0.1),
              ("GPU Passthrough: ACTIVE", GREEN, 0.1),
              ("VFIO Status: ENABLED", GREEN, 0.1),
              ("IOMMU Group: 0000:01:00.0", GREEN, 0.3),
              ("", None, 0.5),
              ("root@darkpix:~# sudo lspci | grep -i nvidia", GREEN, 0.8),
              ("01:00.0 VGA compatible controller: NVIDIA Corporation AD102 [GeForce RTX 4090] (rev a1)", CYAN, 0.2),
              ("01:00.1 Audio device: NVIDIA Corporation AD102 High Definition Audio Controller (rev a1)", CYAN, 0.3),
              ("", None, 0.5),
              ("root@darkpix:~# cat /proc/cmdline", GREEN, 0.8),
              ("BOOT_IMAGE=/boot/vmlinuz-linux root=UUID=dead-beef rw quiet amd_iommu=on iommu=pt", CYAN, 0.2),
              ("vfio-pci.ids=10de:2684,10de:22ba pcie_acs_override=downstream,multifunction", CYAN, 0.3),
              ("", None, 0.5),
              ("root@darkpix:~# docker ps", GREEN, 0.8),
              ("CONTAINER ID   IMAGE                 STATUS          PORTS                    NAMES", PINK, 0.2),
              ("deadbeef1234   proxmox-ve:latest   Up 69 days      0.0.0.0:8006->8006/tcp   pve-node-01", CYAN, 0.15),
              ("cafebabe5678   nginx:alpine        Up 420 hours    0.0.0.0:80->80/tcp       darkpix-proxy", CYAN, 0.15),
              ("1337d00d9999   wireguard:latest    Up 1337 hours   0.0.0.0:51820->51820/udp vpn-mesh", CYAN, 0.3),
              ("", None, 0.5),
              ("root@darkpix:~# nmap -sS -O 192.168.1.1 --top-ports 5", GREEN, 0.8),
              ("Starting Nmap 7.94 ( https://nmap.org )", GRAY, 0.2),
              ("Host is up (0.00032s latency).", CYAN, 0.2),
              ("Not shown: 995 closed tcp ports", GRAY, 0.2),
              ("", None, 0.1),
              ("PORT     STATE    SERVICE", PINK, 0.15),
              ("22/tcp   open     ssh", CYAN, 0.15),
              ("53/tcp   open     domain", CYAN, 0.15),
              ("80/tcp   open     http", CYAN, 0.15),
              ("443/tcp  open     https", CYAN, 0.15),
              ("", None, 0.1),
              ("MAC Address: DE:AD:BE:EF:CA:FE (Proxmox Virtual NIC)", GRAY, 0.2),
              ("Device type: router|firewall", CYAN, 0.2),
              ("Running: Linux 5.x | OS details: Proxmox VE 8.1", CYAN, 0.2),
              ("Network Distance: 0 hops", CYAN, 0.3),
              ("", None, 0.5),
              ("root@darkpix:~# echo '[GPU-PASSTHROUGH] STATUS: ACTIVE'", GREEN, 0.5),
              ("[VFIO-DRIVER]    LOADED: YES", GREEN, 0.15),
              ("[IOMMU]          ENABLED: YES", GREEN, 0.15),
              ("[PCI-STUB]       BOUND: 0000:01:00.0", GREEN, 0.15),
              ("[VM-WINDOWS11]   RUNNING: YES (8 vCPU, 32GB RAM, GTX 4090)", GREEN, 0.15),
              ("[VM-UBUNTU]      RUNNING: YES (4 vCPU, 16GB RAM, VirtIO)", GREEN, 0.15),
              ("[UPTIME]         420 days, 6 hours, 9 minutes", CYAN, 0.15),
              ("[TEMP]           GPU: 45°C | CPU: 62°C | PVE: 38°C", CYAN, 0.3),
              ("", None, 0.5),
              ("root@darkpix:~# cmatrix -C green -u 3", GREEN, 0.8),
              ("ｦ ｧ ｨ ｩ ｪ ｫ ｬ ｭ ｮ ｯ ｰ ｱ ｲ ｳ ｴ ｵ ｶ ｷ ｸ ｹ ｺ ｻ ｼ ｽ ｾ ｿ", GREEN, 0.1),
              ("ｱ ｲ ｳ ｴ ｵ ｶ ｷ ｸ ｹ ｺ ｻ ｼ ｽ ｾ ｿ ﾀ ﾁ ﾂ ﾃ ﾄ ﾅ ﾆ ﾇ ﾈ ﾉ ﾊ", GREEN, 0.1),
              ("ｳ ｴ ｵ ｶ ｷ ｸ ｹ ｺ ｻ ｼ ｽ ｾ ｿ ﾀ ﾁ ﾂ ﾃ ﾄ ﾅ ﾆ ﾇ ﾈ ﾉ ﾊ ﾋ ﾌ", GREEN, 0.1),
              ("ｵ ｶ ｷ ｸ ｹ ｺ ｻ ｼ ｽ ｾ ｿ ﾀ ﾁ ﾂ ﾃ ﾄ ﾅ ﾆ ﾇ ﾈ ﾉ ﾊ ﾋ ﾌ ﾍ ﾎ", GREEN, 0.1),
              ("ｷ ｸ ｹ ｺ ｻ ｼ ｽ ｾ ｿ ﾀ ﾁ ﾂ ﾃ ﾄ ﾅ ﾆ ﾇ ﾈ ﾉ ﾊ ﾋ ﾌ ﾍ ﾎ ﾏ ﾐ", GREEN, 0.3),
              ("", None, 0.3),
              ("root@darkpix:~# clear", GREEN, 0.5),
              ("", None, 0.3),
              ("root@darkpix:~# echo 'System Secure. Root Access Granted.'", GREEN, 0.8),
              ("", None, 0.3),
              ("╔═══════════════════════════════════════════════════════════════════════╗", PINK, 0.1),
              ("║                                                                       ║", PINK, 0.1),
              ("║     ███████╗██╗   ██╗███████╗████████╗███████╗███╗   ███╗             ║", PINK, 0.1),
              ("║     ██╔════╝╚██╗ ██╔╝██╔════╝╚══██╔══╝██╔════╝████╗ ████║             ║", PINK, 0.1),
              ("║     ███████╗ ╚████╔╝ ███████╗   ██║   █████╗  ██╔████╔██║             ║", PINK, 0.1),
              ("║     ╚════██║  ╚██╔╝  ╚════██║   ██║   ██╔══╝  ██║╚██╔╝██║             ║", PINK, 0.1),
              ("║     ███████║   ██║   ███████║   ██║   ███████╗██║ ╚═╝ ██║             ║", PINK, 0.1),
              ("║     ╚══════╝   ╚═╝   ╚══════╝   ╚═╝   ╚══════╝╚═╝     ╚═╝             ║", PINK, 0.1),
              ("║                                                                       ║", PINK, 0.1),
              ("║              D A R K P I X 4 0 4  -  C Y B E R  A R C H I T E C T    ║", CYAN, 0.1),
              ("║                                                                       ║", PINK, 0.1),
              ("╚═══════════════════════════════════════════════════════════════════════╝", PINK, 0.1),
              ("", None, 3.0),
          ]

          current_lines = []
          cursor_visible = True

          for text, color, delay in scenes:
              if text:
                  current_lines.append((text, color))
              
              # Создаём кадр
              img = Image.new('RGB', (W, H), BG)
              draw = ImageDraw.Draw(img)
              
              # Рамка терминала
              draw.rectangle([8, 8, W-8, H-8], outline=BORDER, width=2)
              # Заголовок окна
              draw.rectangle([8, 8, W-8, 42], fill=HEADER_BG)
              # Кнопки управления
              draw.ellipse([20, 18, 32, 30], fill=RED)
              draw.ellipse([40, 18, 52, 30], fill=YELLOW)
              draw.ellipse([60, 18, 72, 30], fill=GREEN_BTN)
              # Текст заголовка
              draw.text((380, 16), "darkpix@arch: ~", fill=GRAY, font=font)
              
              # Выводим строки (последние 18)
              y = 55
              visible_lines = current_lines[-18:] if len(current_lines) > 18 else current_lines
              for line, col in visible_lines:
                  if line:
                      draw.text((20, y), line, fill=col or GREEN, font=font)
                  y += 24
              
              # Мигающий курсор
              if visible_lines:
                  last_y = 55 + (len(visible_lines) - 1) * 24
                  if cursor_visible:
                      draw.rectangle([20, last_y + 22, 32, last_y + 36], fill=GREEN)
              
              cursor_visible = not cursor_visible
              
              # Добавляем кадры с задержкой
              frame_count = max(1, int(delay * 10))
              for _ in range(frame_count):
                  frames.append(img.copy())
          
          # Сохраняем GIF
          if frames:
              frames[0].save(
                  'assets/terminal.gif',
                  save_all=True,
                  append_images=frames[1:],
                  duration=100,
                  loop=0,
                  optimize=False
              )
              print(f"GIF saved! Total frames: {len(frames)}")
          else:
              print("No frames generated!")
          PYEOF
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/terminal.gif
          git diff --cached --quiet || git commit -m "Update terminal animation"
          git push
